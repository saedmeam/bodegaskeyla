<div class="global-layout">
    @if (navService.showNav()) {
    <app-header></app-header>
    <app-menu-principal></app-menu-principal>
    }
    <main class="router-container" [class.no-nav]="!navService.showNav()">
        <router-outlet></router-outlet>
    </main>
</div>

<!-- Premium Notification Pill (v104.5 Global) -->
@if (notificationService.message()) {
<div class="premium-toast-container">
    <div class="premium-pill" [class.error]="notificationService.isError()">
        <div class="pill-icon-circle">
            <span class="icon">{{ notificationService.isError() ? '❌' : '✅' }}</span>
        </div>
        <div class="pill-content">
            <div class="pill-title">{{ notificationService.title() }}</div>
            <div class="pill-msg" [innerHTML]="notificationService.message()"></div>
        </div>
    </div>
</div>
}

<!-- Global Loading Screen -->
<app-loading-screen></app-loading-screen>
